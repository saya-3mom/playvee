spring.application.name=playvee
server.servlet.session.timeout=12h
server.servlet.session.persistent=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
playvee.bootstrap.login-id=${PLAYVEE_BOOTSTRAP_LOGIN_ID:}
playvee.bootstrap.password-hash=${PLAYVEE_BOOTSTRAP_PASSWORD_HASH:}
playvee.upload-dir=${PLAYVEE_UPLOAD_DIR:./uploads/parks}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=jdbc:postgresql://localhost:5434/playvee
spring.datasource.username=playvee
spring.datasource.password=playvee
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
