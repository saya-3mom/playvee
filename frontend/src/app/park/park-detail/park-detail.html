<main>
  <a mat-stroked-button routerLink="/parks">一覧へ戻る</a>
  @if (loading()) {
    <p role="status">読み込み中…</p>
  } @else if (error()) {
    <p role="alert">{{ error() }}</p>
  } @else if (park(); as park) {
    <mat-card appearance="outlined">
      <mat-card-content>
        <h1>{{ park.name }}</h1>
        <p>{{ park.address }}</p>
      </mat-card-content>
    </mat-card>
  }
</main>
