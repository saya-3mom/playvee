<main>
  <h1>公園一覧</h1>
  <a class="create-link" mat-flat-button routerLink="/parks/new">＋ 公園を登録</a>
  @if (loading()) {
    <p role="status">読み込み中…</p>
  } @else if (failed()) {
    <p role="alert">公園一覧を取得できませんでした。</p>
  } @else {
    <ul>
      @for (park of parks(); track park.id) {
        <li>
          <a class="park-link" [routerLink]="['/parks', park.id]">
          <mat-card appearance="outlined">
            <mat-card-content>
              <h2>{{ park.name }}</h2>
              <p>{{ park.address }}</p>
              <span class="chevron" aria-hidden="true">›</span>
            </mat-card-content>
          </mat-card>
          </a>
        </li>
      } @empty {
        <li>公園がありません。</li>
      }
    </ul>
  }
</main>
