<main>
  <h1>公園一覧</h1>
  @if (loading()) {
    <p role="status">読み込み中…</p>
  } @else if (failed()) {
    <p role="alert">公園一覧を取得できませんでした。</p>
  } @else {
    <ul>
      @for (park of parks(); track park.id) {
        <li>
          <mat-card appearance="outlined">
            <mat-card-content>
              <h2><a [routerLink]="['/parks', park.id]">{{ park.name }}</a></h2>
              <p>{{ park.address }}</p>
            </mat-card-content>
          </mat-card>
        </li>
      } @empty {
        <li>公園がありません。</li>
      }
    </ul>
  }
</main>
