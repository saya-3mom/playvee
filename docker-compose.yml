services:

  postgres:
    image: postgres:16
    container_name: playvee-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: playvee-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PLAYVEE_UPLOAD_DIR: /app/uploads/parks
      PLAYVEE_BOOTSTRAP_LOGIN_ID: ${PLAYVEE_BOOTSTRAP_LOGIN_ID:-}
      PLAYVEE_BOOTSTRAP_PASSWORD_HASH: ${PLAYVEE_BOOTSTRAP_PASSWORD_HASH:-}
    volumes:
      - photo_data:/app/uploads
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: playvee-frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  photo_data:
  postgres_data:
