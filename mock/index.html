<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ココミケ - 公園の「知りたかった」が、行く前にわかる。</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header__brand">
        <span class="header__logo" aria-hidden="true">🌳</span>
        <div>
          <h1 class="header__title">ココミケ</h1>
          <p class="header__catch">公園の「知りたかった」が、行く前にわかる。</p>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- 検索 -->
      <section class="section" aria-labelledby="search-title">
        <h2 class="visually-hidden" id="search-title">公園を探す</h2>
        <form class="search-bar" action="#" role="search">
          <span class="material-icons-round search-bar__icon" aria-hidden="true">search</span>
          <input
            class="search-bar__input"
            type="search"
            placeholder="公園名・エリアで検索"
            aria-label="公園名・エリアで検索"
          >
        </form>
      </section>

      <!-- よく探す条件 -->
      <section class="section" aria-labelledby="filters-title">
        <h2 class="section__title" id="filters-title">よく探す条件</h2>
        <div class="filter-chips" id="filter-chips"></div>
      </section>

      <!-- 最近追加された写真 -->
      <section class="section" aria-labelledby="photos-title">
        <div class="section__header">
          <h2 class="section__title" id="photos-title">最近追加された写真</h2>
          <a class="section__link" href="#">もっと見る</a>
        </div>
        <p class="section__lead">みんなが撮った最新の公園写真。行く前のイメージづくりに。</p>
        <div class="scroll-row photo-cards" id="recent-photos"></div>
      </section>

      <!-- 近くの公園 -->
      <section class="section" aria-labelledby="nearby-title">
        <div class="section__header">
          <h2 class="section__title" id="nearby-title">近くの公園</h2>
          <a class="section__link" href="#">地図で見る</a>
        </div>
        <div class="scroll-row park-cards" id="nearby-parks"></div>
      </section>

      <!-- 最近確認された設備 -->
      <section class="section" aria-labelledby="fresh-title">
        <div class="section__header">
          <h2 class="section__title" id="fresh-title">最近確認された設備</h2>
          <a class="section__link" href="#">もっと見る</a>
        </div>
        <p class="section__lead">設備ごとにいつ確認されたかがわかります。色が濃いほど情報が新しいです。</p>
        <ul class="facility-list" id="recent-facilities"></ul>
      </section>
    </main>

    <!-- ボトムナビ -->
    <nav class="bottom-nav" aria-label="メインメニュー">
      <a class="bottom-nav__item bottom-nav__item--active" href="index.html" aria-current="page">
        <span class="material-icons-round" aria-hidden="true">home</span>
        <span class="bottom-nav__label">ホーム</span>
      </a>
      <a class="bottom-nav__item" href="#">
        <span class="material-icons-round" aria-hidden="true">search</span>
        <span class="bottom-nav__label">探す</span>
      </a>
      <a class="bottom-nav__item" href="#">
        <span class="material-icons-round" aria-hidden="true">add_a_photo</span>
        <span class="bottom-nav__label">投稿</span>
      </a>
      <a class="bottom-nav__item" href="#">
        <span class="material-icons-round" aria-hidden="true">person</span>
        <span class="bottom-nav__label">マイページ</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
